.bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 600px at 80% 0%,rgba(255,255,255,.95),transparent 60%),
  radial-gradient(800px 700px at 0% 70%,rgba(255,255,255,.7),transparent 60%),
  repeating-linear-gradient(100deg,rgba(255,255,255,.18) 0 2px,rgba(0,0,0,.015) 2px 5px),
  linear-gradient(180deg,var(--silver-1),var(--silver-2) 55%,var(--silver-3))}
.bg-dark{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1000px 700px at 50% 30%,#2a2212 0%,transparent 60%),radial-gradient(900px 700px at 0% 100%,#11152a,transparent 60%),#07080c}
.progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));z-index:70}

/* header */
.top{position:fixed;inset:0 0 auto;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));color:#f4f0e4;transition:background .4s,color .4s,box-shadow .4s}
.top.light{color:var(--ink);background:rgba(240,242,246,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 10px 30px -20px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand img{height:30px;width:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.brand b{letter-spacing:2px;font-size:15px;direction:ltr;font-weight:900}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(227,191,92,.45)}
.top.light .seg{background:rgba(255,255,255,.7);border-color:rgba(184,134,42,.35)}
.seg button{border:0;background:transparent;color:inherit;font-weight:800;font-size:13px;min-width:36px;height:30px;padding:0 9px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink)}

/* 3D text */
.t3d{color:#d9ad4b;text-shadow:0 1px 0 #c79a39,0 2px 0 #b48829,0 3px 0 #a07720,0 4px 0 #8c6719,0 5px 0 #785712,0 6px 1px rgba(0,0,0,.25),0 10px 18px rgba(0,0,0,.35),0 20px 40px rgba(0,0,0,.2)}
.on-silver .t3d,.t3d.sv{color:#b8862a;text-shadow:0 1px 0 #a87a22,0 2px 0 #966b1c,0 3px 0 #835d16,0 4px 0 #704f10,0 5px 1px rgba(0,0,0,.18),0 10px 16px rgba(60,40,0,.22),0 18px 34px rgba(30,30,40,.18)}
.word{display:inline-block;transform-origin:50% 100%;will-change:transform,opacity}
.split .word{opacity:0;transform:perspective(700px) rotateX(-85deg) translateY(.4em) translateZ(-60px)}
.split.in .word{opacity:1;transform:none;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease;transition-delay:calc(var(--i)*55ms)}

/* 3D windows */
.w3d{opacity:0;transform:perspective(1100px) rotateX(22deg) rotateY(calc(var(--dir,1)*-18deg)) translateY(70px) translateZ(-220px) scale(.94);filter:blur(6px);transition:transform 1.1s cubic-bezier(.16,.84,.24,1),opacity .9s ease,filter .9s ease;transition-delay:calc(var(--d,0)*90ms)}
.w3d.in{opacity:1;transform:perspective(1100px) rotateX(0) rotateY(0) translateY(0) translateZ(0) scale(1);filter:none}
.fade{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease;transition-delay:calc(var(--d,0)*90ms)}
.fade.in{opacity:1;transform:none}
.tilt{transform-style:preserve-3d;transition:transform .25s ease}

/* HERO */
.hero{height:100svh;position:relative;color:#f4f0e4}
#about{padding-top:40px}
.hero-stick{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vh,18px);overflow:hidden;perspective:1100px;padding:64px 16px 80px}
.beam{position:absolute;top:-10%;left:50%;width:min(90vw,760px);height:78%;translate:-50% 0;background:linear-gradient(180deg,rgba(255,236,190,.55),rgba(255,226,160,.18) 45%,transparent 85%);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);filter:blur(18px);opacity:.75;pointer-events:none;animation:beam 6s ease-in-out infinite}
@keyframes beam{50%{opacity:.55}}
.beam::before{content:"";position:absolute;top:0;left:50%;width:90px;height:14px;translate:-50% 0;border-radius:50%;background:#fff6dc;filter:blur(6px)}
.lines{position:absolute;inset:0;pointer-events:none;opacity:.35;background:radial-gradient(circle at 50% 44%,transparent 0 22%,rgba(227,191,92,.25) 22.2% 22.4%,transparent 22.6% 34%,rgba(227,191,92,.14) 34.2% 34.35%,transparent 34.6%),repeating-conic-gradient(from 0deg at 50% 44%,rgba(227,191,92,.12) 0 .6deg,transparent .6deg 15deg);mask:radial-gradient(circle at 50% 44%,#000 20%,transparent 62%);-webkit-mask:radial-gradient(circle at 50% 44%,#000 20%,transparent 62%);animation:spin 80s linear infinite}
@keyframes spin{to{rotate:360deg}}
.floor{position:absolute;left:50%;top:58%;width:min(70vw,520px);height:70px;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,140,.35),rgba(255,220,140,.08) 60%,transparent);filter:blur(4px);pointer-events:none}
.halo{position:absolute;top:42%;left:50%;width:min(120vw,980px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(227,191,92,.32),rgba(227,191,92,.08) 55%,transparent);animation:halo 5s ease-in-out infinite}
@keyframes halo{50%{opacity:.7;scale:1.06}}
.logo3d{position:relative;width:min(78vw,440px,48vh);aspect-ratio:560/406;transform-style:preserve-3d;will-change:transform;animation:logoIn 1.8s cubic-bezier(.16,.84,.24,1) both}
@keyframes logoIn{from{opacity:0;transform:rotateY(-70deg) rotateX(30deg) translateZ(-500px) scale(.6);filter:blur(14px)}to{opacity:1;filter:none}}
.logo3d img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden}
.logo3d .ex{filter:brightness(.38) sepia(.6) saturate(1.4)}
.logo3d .front{filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.sweep{position:absolute;inset:0;transform:translateZ(1px);pointer-events:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 48%,transparent 60%);background-size:260% 100%;animation:sweep 3.6s ease-in-out 1.6s infinite;mix-blend-mode:screen}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.orbit{position:absolute;inset:-18%;transform-style:preserve-3d;pointer-events:none}
.orbit i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffe7a1;box-shadow:0 0 10px 3px rgba(255,214,120,.8)}
.wm{width:min(84vw,520px);filter:drop-shadow(0 14px 24px rgba(0,0,0,.6));animation:wmIn 1.6s .5s cubic-bezier(.16,.84,.24,1) both;transform-style:preserve-3d}
@keyframes wmIn{from{opacity:0;transform:perspective(800px) rotateX(70deg) translateY(30px);filter:blur(8px)}}
.hero-copy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:900px}
.hero h1{margin:4px 0 0;font-size:clamp(23px,5.4vw,48px);line-height:1.45;font-weight:900}
.hero .lead{margin:0;color:#d6d0bf;font-size:clamp(15px,2.5vw,19px);max-width:700px}
.hint{position:absolute;bottom:3vh;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:#b9b2a0}
.hint i{width:22px;height:36px;border-radius:12px;border:2px solid #b9b2a0;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold-2);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(12px)}}

/* sections */
.sec{padding:110px 0;position:relative}
.head{display:flex;flex-direction:column;gap:10px;margin-bottom:42px;max-width:820px}
.head.center{margin-inline:auto;text-align:center;align-items:center}
.eyebrow{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--gold-d);padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(184,134,42,.35);box-shadow:0 6px 14px -8px rgba(0,0,0,.25)}
.head.center .eyebrow{align-self:center}
.h2{margin:0;font-size:clamp(28px,5.6vw,52px);font-weight:900;line-height:1.35}
.sub{margin:0;color:var(--muted);font-size:clamp(15.5px,2.4vw,18.5px)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);box-shadow:var(--card-shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#fff;border:1px solid rgba(184,134,42,.3);color:var(--gold-d);font-weight:800;font-size:12.5px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;font-size:15px;padding:12px 22px;border-radius:999px;border:1px solid rgba(184,134,42,.35);background:#fff;color:var(--ink);cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(180deg,#f3d27e,#c8962f);color:var(--gold-ink);border-color:#a87a22;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 28px -12px rgba(140,100,20,.8)}
.btn.dark{background:linear-gradient(180deg,#2a2b33,#121318);color:#f3e4b8;border-color:#000}
.btn svg{width:18px;height:18px;flex:none}

/* services */
.svc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.svc .card{grid-column:span 2;overflow:hidden;display:flex;flex-direction:column}
.svc .card:nth-child(1),.svc .card:nth-child(2){grid-column:span 3}
.art{position:relative;height:150px;background:radial-gradient(400px 180px at 50% 120%,#3a2d10,transparent),linear-gradient(160deg,#1a1c25,#0b0c11);overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art{height:190px}
.art.phx img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.4s cubic-bezier(.16,.84,.24,1)}
.card:hover .art.phx img{transform:scale(1.14)}
.art.phx::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,9,13,.55));pointer-events:none}
.art.stagefx{background:radial-gradient(500px 160px at 50% 115%,rgba(227,191,92,.55),transparent 70%),linear-gradient(170deg,#1a1b22,#07080b)}
.art.stagefx i{position:absolute;top:-20%;width:34%;height:140%;background:linear-gradient(180deg,rgba(255,230,170,.55),transparent 75%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(6px);transform-origin:50% 0;animation:sweepb 5s ease-in-out infinite}
.art.stagefx i:nth-child(1){left:8%;animation-delay:-1s}.art.stagefx i:nth-child(2){left:33%;animation-delay:-2.5s}.art.stagefx i:nth-child(3){left:58%;animation-delay:-4s}
.art.stagefx b{position:absolute;left:10%;right:10%;bottom:14px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,140,.7),transparent);filter:blur(2px)}
@keyframes sweepb{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.art .gl{stroke:#e3bf5c;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .gf{fill:#e3bf5c}
.art .sl{stroke:#cfd3dc;stroke-width:1.2;fill:none;opacity:.55}
.svc .body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.svc h3{margin:0;font-size:20px;font-weight:900;line-height:1.5}
.svc p{margin:0;color:var(--muted);font-size:15.5px}
.svc .chip{align-self:flex-start}

/* electro batom */
.eb-win{position:relative;border-radius:34px;overflow:hidden;color:#f3efe2;background:#0b0d12;box-shadow:0 50px 100px -40px rgba(10,12,20,.8),0 0 0 1px rgba(227,191,92,.35);transform-style:preserve-3d}
.scene{position:relative;height:min(78vh,640px);min-height:480px;overflow:hidden}
.scene .layer{position:absolute;left:-4%;top:-6%;width:108%;height:112%;object-fit:cover;will-change:transform}
.fog{position:absolute;inset-inline:-30%;height:40%;border-radius:50%;background:radial-gradient(closest-side,rgba(220,226,234,.55),transparent);filter:blur(10px);animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.snow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fff,transparent),radial-gradient(2px 2px at 80% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 85%,#fff,transparent),radial-gradient(1px 1px at 10% 60%,#fff,transparent),radial-gradient(2px 2px at 90% 55%,#fff,transparent);background-size:260px 260px;animation:snow 9s linear infinite;opacity:.7}
@keyframes snow{to{background-position:-60px 260px,40px 260px,-30px 260px,20px 260px,-50px 260px,30px 260px}}
.eb-over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:clamp(22px,5vw,56px);background:linear-gradient(180deg,rgba(8,9,13,.55) 0%,transparent 30%,transparent 45%,rgba(8,9,13,.92) 100%)}
.eb-tag{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;background:rgba(227,191,92,.16);border:1px solid rgba(227,191,92,.55);color:#f4d77d;backdrop-filter:blur(6px)}
.eb-tag i{width:8px;height:8px;border-radius:50%;background:#f4d77d;box-shadow:0 0 10px #f4d77d;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.eb-title{margin:0;direction:ltr;text-align:left;font-weight:900;font-size:clamp(44px,10vw,110px);line-height:.95;letter-spacing:-1px;color:#e9edf3;text-shadow:0 1px 0 #c9ced8,0 2px 0 #b3b9c4,0 3px 0 #9aa1ad,0 4px 0 #848b97,0 5px 0 #6e7480,0 7px 2px rgba(0,0,0,.4),0 14px 30px rgba(0,0,0,.6)}
.eb-title span{color:#f1cc6a;text-shadow:0 1px 0 #d9b04f,0 2px 0 #c49a3b,0 3px 0 #ad842b,0 4px 0 #946e1f,0 5px 0 #7b5a15,0 7px 2px rgba(0,0,0,.4),0 14px 30px rgba(0,0,0,.6)}
html[dir="rtl"] .eb-title{text-align:right}
.eb-name{font-size:clamp(20px,4vw,30px);font-weight:900;color:#f4d77d}
.eb-hook{font-size:clamp(18px,3.4vw,28px);font-weight:900;line-height:1.6;max-width:760px}
.eb-hook em{font-style:normal;color:#f4d77d}
.phone-warn{position:absolute;top:16%;inset-inline-end:8%;width:clamp(120px,22vw,170px);padding:14px;border-radius:22px;background:rgba(14,16,22,.82);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 50px -20px rgba(0,0,0,.8);backdrop-filter:blur(8px);text-align:center;transform:perspective(700px) rotateY(-18deg) rotateX(8deg);animation:float 5s ease-in-out infinite}
html[dir="ltr"] .phone-warn{transform:perspective(700px) rotateY(18deg) rotateX(8deg)}
@keyframes float{50%{translate:0 -10px}}
.bat{width:58px;height:26px;margin:4px auto 6px;border:2px solid #e8e8e8;border-radius:6px;position:relative;padding:3px}
.bat::after{content:"";position:absolute;right:-6px;top:7px;width:4px;height:8px;border-radius:0 2px 2px 0;background:#e8e8e8}
.bat i{display:block;width:8%;height:100%;border-radius:2px;background:#ff4d4f;animation:pulse 1s infinite}
.phone-warn b{display:block;color:#ff6b6b;font-size:22px}
.phone-warn small{color:#cfd3dc;font-size:12px;line-height:1.5;display:block}
.eb-body{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(20px,4vw,48px);padding:clamp(24px,5vw,56px);align-items:center;background:radial-gradient(700px 400px at 80% 0%,#2a210b,transparent 60%),#0b0d12}
.eb-points{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eb-points div{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(227,191,92,.25)}
.eb-points b{display:block;font-size:16px;color:#f4d77d}
.eb-points span{font-size:13.5px;color:#c7c2b3}
.eb-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.eb-note{color:#bdb7a6;font-size:14.5px;margin:12px 0 0}
.gallery{position:relative;height:clamp(300px,42vw,430px);perspective:1200px;transform-style:preserve-3d}
.ph{position:absolute;top:50%;left:50%;width:44%;aspect-ratio:3/4;margin:0;border-radius:18px;overflow:hidden;border:2px solid rgba(227,191,92,.7);box-shadow:0 30px 50px -18px rgba(0,0,0,.85);background:#111;transition:transform 1.2s cubic-bezier(.16,.84,.24,1),opacity 1s}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;inset:auto 0 0;padding:8px 10px;font-size:12.5px;font-weight:800;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#f4d77d}
.gallery .ph{transform:translate(-50%,-50%) translateZ(-400px) rotateY(0) scale(.6);opacity:0}
.gallery.in .p1{transform:translate(-112%,-52%) rotateY(28deg) rotateZ(-6deg);opacity:1}
.gallery.in .p2{transform:translate(-50%,-50%) translateZ(60px);opacity:1;z-index:2;transition-delay:.15s}
.gallery.in .p3{transform:translate(12%,-48%) rotateY(-28deg) rotateZ(6deg);opacity:1;transition-delay:.3s}

/* apps rail */
.rail{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px calc(50% - var(--cw)/2) 46px;--cw:min(350px,84vw);scrollbar-width:none;perspective:1400px;cursor:grab;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail.drag{scroll-snap-type:none;cursor:grabbing}
.slot{flex:0 0 var(--cw);scroll-snap-align:center;transform-style:preserve-3d}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;will-change:transform,opacity}
.thumb{position:relative;height:190px;background:linear-gradient(160deg,#1c1e27,#0c0d12);overflow:hidden;perspective:900px}
.thumb .mini{position:absolute;left:50%;top:18px;width:560px;height:350px;transform-origin:top center;border-radius:12px;overflow:hidden;background:var(--scr);color:var(--scr-ink);font-size:13px;line-height:1.6;box-shadow:0 20px 40px -10px rgba(0,0,0,.8);pointer-events:none}
.thumb .mini.phone{width:300px;height:560px;border-radius:28px;border:8px solid #22242b}
.thumb .mini .sc{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;gap:9px}
.thumb .mini.phone .sc{padding:22px 14px 14px}
.thumb::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,rgba(12,13,18,.65))}
.app .ic{position:absolute;z-index:2;inset-inline-start:16px;bottom:-24px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#f3d27e,#b8862a);color:var(--gold-ink);box-shadow:0 12px 24px -8px rgba(120,80,10,.7),0 0 0 4px #f3f4f6}
.app .ic svg{width:28px;height:28px}
.app .num{position:absolute;z-index:2;inset-inline-end:14px;top:10px;font-weight:900;font-size:30px;color:transparent;-webkit-text-stroke:1.2px #e3bf5c}
.app .in{padding:34px 22px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.app h3{margin:0;font-size:21px;font-weight:900;line-height:1.45}
.app .pitch{margin:0;color:var(--muted);font-size:14.5px;line-height:1.75}
.feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.feats li{display:flex;gap:9px;font-size:14px;line-height:1.6}
.feats li::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:2px;background:linear-gradient(135deg,#f3d27e,#b8862a);transform:rotate(45deg)}
.feats b{color:var(--ink)}
.app .foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:6px}
.plats{display:flex;flex-wrap:wrap;gap:6px}
.app .btn{width:100%}
.live{font-size:12px;font-weight:800;color:#0f8f5a;display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#16b56f;box-shadow:0 0 8px #16b56f}
.app.custom{justify-content:center;align-items:center;text-align:center;padding:30px 24px;gap:14px;cursor:default}
.app.custom .plus{font-size:84px;font-weight:900;line-height:1}
.rail-ctl{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:-14px}
.rail-ctl button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(184,134,42,.35);background:#fff;color:var(--gold-d);cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 20px -12px rgba(0,0,0,.4)}
.rail-ctl svg{width:20px;height:20px}
html[dir="rtl"] .rail-ctl svg{transform:scaleX(-1)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:#8d887b;opacity:.4;transition:all .3s}
.dots i.on{width:24px;border-radius:5px;background:var(--gold);opacity:1}
.swipe{display:flex;justify-content:center;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin-top:8px}
.swipe svg{width:22px;height:22px;animation:sway 1.8s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(-8px)}}

/* why/steps/contact */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.grid4 .card{padding:24px 22px;display:flex;flex-direction:column;gap:6px}
.grid4 b{font-size:18.5px}
.grid4 span{color:var(--muted);font-size:15px}
.grid4 .n{font-size:46px;font-weight:900;line-height:1.1}
.grid4 .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f3d27e,#b8862a);color:var(--gold-ink);margin-bottom:6px}
.grid4 .ico svg{width:24px;height:24px}
.contact{padding:52px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;background:radial-gradient(600px 300px at 50% 0%,#2a210b,transparent 70%),linear-gradient(160deg,#16171e,#0a0b0f);color:#f3efe2;border:1px solid rgba(227,191,92,.4)}
.contact .sub{color:#c9c3b2}
.contact .eyebrow{background:rgba(227,191,92,.12);color:#f4d77d;border-color:rgba(227,191,92,.5);align-self:center}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
footer{padding:48px 16px 56px;text-align:center;color:#bdb7a6;font-size:14px;background:radial-gradient(600px 240px at 50% 0%,#2a210b,transparent 70%),#07080c;margin-top:40px}
footer img{width:min(300px,70vw);display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}

/* detail page */
main{transition:transform .8s cubic-bezier(.16,.84,.24,1),filter .8s}
body.det-open main{transform:perspective(1200px) translateZ(-160px) rotateY(calc(var(--side,1)*6deg));filter:blur(4px) brightness(.8)}
body.det-open{overflow:hidden}
.detail{position:fixed;inset:0;z-index:80;display:none;perspective:1600px}
.detail.open{display:block}
.dpage{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(180deg,#f7f8fa,#dfe2e7);transform-origin:50% 50%;will-change:transform,opacity;overscroll-behavior:contain}
.dtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(245,246,248,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.06)}
.dtop .back{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(184,134,42,.4);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;color:var(--ink)}
.dtop .back svg{width:18px;height:18px}
html[dir="rtl"] .dtop .back svg{transform:scaleX(-1)}
.dtop b{font-size:16px}
.dhero{position:relative;padding:44px 0 30px;background:radial-gradient(800px 400px at 70% 0%,#2a210b,transparent 60%),linear-gradient(170deg,#14151c,#07080c);color:#f3efe2;overflow:hidden}
.dhero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center}
.dhero h2{margin:8px 0 6px;font-size:clamp(28px,5.4vw,50px);line-height:1.35;font-weight:900}
.dhero p{color:#d3cdbb;font-size:clamp(15.5px,2.4vw,18.5px);margin:0 0 16px}
.dhero .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#f3d27e,#b8862a);color:var(--gold-ink)}
.dhero .ic svg{width:32px;height:32px}
.dev{position:relative;width:100%;margin-inline:auto;transform:perspective(1200px) rotateY(calc(var(--side,1)*-16deg)) rotateX(8deg);transform-style:preserve-3d;animation:devIn 1.2s .3s cubic-bezier(.16,.84,.24,1) both}
@keyframes devIn{from{opacity:0;transform:perspective(1200px) rotateY(calc(var(--side,1)*-60deg)) rotateX(30deg) translateZ(-300px)}}
.dev .frame{background:#1c1d22;border-radius:18px;padding:10px;box-shadow:0 40px 70px -24px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.1)}
.dev.desk{max-width:560px}
.dev.desk .scr{aspect-ratio:16/10.5}
.dev.phone{max-width:270px}
.dev.phone .frame{border-radius:40px;padding:11px}
.dev.phone .scr{aspect-ratio:9/18.5;border-radius:30px}
.scr{position:relative;background:var(--scr);color:var(--scr-ink);border-radius:10px;overflow:hidden;font-size:12.5px;line-height:1.6}
.scr .sc{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;gap:8px}
.dev.phone .scr .sc{padding:30px 13px 13px}
.dsec{padding:56px 0}
.dsec h3{margin:0 0 22px;font-size:clamp(24px,4.4vw,38px);font-weight:900;line-height:1.4}
.pain{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pain .card{padding:24px}
.pain .bad b{color:#b3261e}.pain .good b{color:#0f8f5a}
.pain p{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fgrid .card{padding:22px}
.fgrid b{display:block;font-size:17px;margin-bottom:4px}
.fgrid span{color:var(--muted);font-size:14.5px}
.fgrid .k{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#f3d27e,#b8862a);color:var(--gold-ink);font-weight:900;margin-bottom:10px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:20px;background:#fff;box-shadow:var(--card-shadow);font-size:15px}
.cmp th,.cmp td{padding:14px 16px;text-align:start;border-bottom:1px solid #eceef2}
.cmp thead th{background:#14151c;color:#f3efe2;font-weight:800}
.cmp thead th.us{background:linear-gradient(180deg,#f3d27e,#c8962f);color:var(--gold-ink)}
.cmp td.us{background:#fff8e6;font-weight:800}
.cmp .y{color:#0f8f5a;font-weight:900}.cmp .n{color:#b3261e;font-weight:900}
.cmp tr:last-child td{border-bottom:0}
.dcta{padding:44px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;background:radial-gradient(600px 300px at 50% 0%,#2a210b,transparent 70%),linear-gradient(160deg,#16171e,#0a0b0f);color:#f3efe2;border-radius:28px;margin-bottom:60px}

/* demo ui kit */
.ui-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--scr-2);font-weight:800}
.ui-bar .lg{width:20px;height:20px;border-radius:6px;background:linear-gradient(145deg,var(--accent-2),var(--accent))}
.ui-bar .sp{flex:1}
.ui-row{display:flex;gap:8px;min-height:0}
.ui-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.ui-box{background:var(--scr-2);border-radius:10px;padding:8px 10px;border:1px solid var(--scr-line)}
.ui-in{display:flex;align-items:center;gap:6px;background:var(--scr);border:1px solid var(--scr-line);border-radius:8px;padding:5px 9px;color:var(--scr-mute)}
.ui-in b{color:var(--scr-ink)}
.ui-it{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px;background:var(--scr);border:1px solid var(--scr-line)}
.ui-it.hl{border-color:var(--accent);box-shadow:0 0 0 2px rgba(227,191,92,.3)}
.ui-it small{color:var(--scr-mute)}
.ui-tot{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;padding:8px 10px;border-radius:10px;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink)}
.ui-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--scr);border:1px solid var(--scr-line);font-size:11.5px;font-weight:700}
.ui-pill.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ui-toast{position:absolute;inset-inline:14%;bottom:12px;padding:9px 12px;border-radius:12px;background:#16a36a;color:#fff;font-weight:800;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.ui-bars{flex:1;display:flex;align-items:flex-end;gap:7px;min-height:60px}
.ui-bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.ui-grid{display:grid;gap:7px}
.ui-tbl{border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:1px;background:var(--scr-2);border:1px solid var(--scr-line)}
.ui-tbl.busy{border-color:#e0a63a;background:#2a2416}
.ui-tbl.new{border-color:#16a36a;box-shadow:0 0 0 2px rgba(22,163,106,.35)}
.ui-tbl .tm{font-weight:900;font-size:14px;direction:ltr;text-align:start}
.mute{color:var(--scr-mute)}
.ok{color:#16a36a;font-weight:900}
.wave{display:flex;align-items:center;gap:3px;height:40px;justify-content:center}
.wave i{width:4px;border-radius:2px;background:var(--accent);animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:36px}}
.ring{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:4px auto;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--scr-2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--scr)}
.ring b{position:relative;font-size:26px}
.fig{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0}
.fig .hd{width:32px;height:32px;border-radius:50%;background:#e9c9a8}
.fig .tp{width:82px;height:66px;border-radius:18px 18px 8px 8px}
.fig .bt{width:66px;height:74px;border-radius:6px 6px 4px 4px;clip-path:polygon(0 0,100% 0,100% 100%,58% 100%,50% 30%,42% 100%,0 100%)}
.fig .sh{display:flex;gap:8px}.fig .sh i{width:28px;height:11px;border-radius:8px 8px 3px 3px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--scr);box-shadow:0 0 0 1px var(--scr-line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.bcard{border-radius:14px;padding:11px;color:#fff;display:flex;flex-direction:column;gap:5px;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.bcard .no{direction:ltr;text-align:left;font-weight:800;letter-spacing:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}
.cal span{padding:3px 0;border-radius:6px}
.cal .h{color:var(--scr-mute);font-weight:800}
.cal .t{background:var(--accent);color:var(--accent-ink);font-weight:900}
.cal .e{position:relative}.cal .e::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#e0567a}
.notif{border-radius:14px;padding:9px 11px;background:var(--scr-2);border:1px solid var(--scr-line)}
.lock{text-align:center;padding:14px 0 6px}
.lock b{font-size:40px;font-weight:300;display:block;line-height:1}
.caret::after{content:"▍";color:var(--accent);animation:pulse .8s infinite}
.micico{width:30px;height:30px;display:block}.micico svg{width:100%;height:100%}

@media (max-width:900px){
  .svc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .svc .card,.svc .card:nth-child(1),.svc .card:nth-child(2){grid-column:span 1}
  .svc .card:nth-child(5){grid-column:span 2}
  .eb-body{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dhero .wrap{grid-template-columns:1fr}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .sec{padding:80px 0}
  .gallery.in .p1{transform:translate(-96%,-52%) rotateY(28deg) rotateZ(-6deg)}
  .gallery.in .p3{transform:translate(-4%,-48%) rotateY(-28deg) rotateZ(6deg)}
  .eb-title{font-size:clamp(40px,12vw,60px)}
  .svc{grid-template-columns:1fr}
  .svc .card:nth-child(n){grid-column:span 1}
  .brand b{display:none}
  .eb-points{grid-template-columns:1fr}
  .phone-warn{top:5%;width:112px;padding:10px;inset-inline-end:5%}
  .pain,.fgrid{grid-template-columns:1fr}
  .cmp{font-size:13px}.cmp th,.cmp td{padding:10px 9px}
  .grid4 .card{padding:18px 16px}
  .rail{--cw:min(290px,64vw);gap:0;perspective:900px;padding-top:36px;padding-bottom:54px}
  .slot{margin-inline:-7vw;position:relative}
  .slot:first-child{margin-inline-start:0}.slot:last-child{margin-inline-end:0}
  .app .in{padding:30px 16px 16px}.app h3{font-size:18px}.app .pitch{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  .w3d,.fade,.split .word{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
}
</style>

   '<section class="dhero"><div class="wrap"><div><div class="ic fade">'+ICONS[a.i]+'</div><span class="eyebrow fade" style="background:rgba(227,191,92,.12);color:#f4d77d;border-color:rgba(227,191,92,.5);margin-top:14px">'+L(a.n)+'</span><h2 class="t3d split">'+L(a.h)+'</h2><p class="fade">'+L(a.p)+'</p><div class="btns fade" style="justify-content:flex-start"><a class="btn gold" href="tel:+98'+CONFIG.phone.replace(/^0/,"")+'">'+ICONS.phone+L(I18N.call)+'</a><span class="plats">'+a.plat.map(function(p){return'<span class="chip">'+L(P[p])+'</span>'}).join("")+'</span></div></div>'+
   '<div class="dev '+a.dev+'"><div class="frame"><div class="scr"><div class="sc">'+DEMOS[a.id][a.shot].r()+'</div></div></div></div></div></section>'+
   '<section class="dsec"><div class="wrap"><h3 class="t3d sv split">'+L(I18N.painT)+'</h3><div class="pain"><div class="card bad w3d" style="--dir:1"><b>✕ '+L(I18N.before)+'</b><p>'+L(a.bad)+'</p></div><div class="card good w3d" style="--d:1;--dir:-1"><b>✓ '+L(I18N.after)+'</b><p>'+L(a.good)+'</p></div></div></div></section>'+
   '<section class="dsec" style="padding-top:0"><div class="wrap"><h3 class="t3d sv split">'+L(I18N.featT)+'</h3><div class="fgrid">'+a.f.map(function(f,i){return'<div class="card w3d" style="--d:'+i+';--dir:'+(i%2?-1:1)+'"><div class="k">'+digits(i+1)+'</div><b>'+f[fi]+'</b><span>'+f[fi+1]+'</span></div>'}).join("")+'</div></div></section>'+
   '<section class="dsec" style="padding-top:0"><div class="wrap"><h3 class="t3d sv split">'+L(I18N.cmpT)+'</h3><div class="w3d"><table class="cmp"><thead><tr><th>'+L(I18N.cmpF)+'</th><th>'+L(I18N.cmpM)+'</th><th class="us">'+L(I18N.cmpU)+'</th></tr></thead><tbody>'+cmp+'</tbody></table></div></div></section>'+
   '<div class="wrap"><div class="dcta w3d"><h3 class="t3d split" style="margin:0;font-size:clamp(22px,4vw,34px)">'+L(I18N.dCtaT)+'</h3><p style="margin:0;color:#c9c3b2">'+L(I18N.dCtaS)+'</p><div class="btns"><a class="btn gold" href="tel:+98'+CONFIG.phone.replace(/^0/,"")+'">'+ICONS.phone+L(I18N.call)+' · <span dir="ltr">'+digits(CONFIG.phone.replace(/(\d{4})(\d{3})(\d{4})/,"$1 $2 $3"))+'</span></a><a class="btn" href="mailto:'+CONFIG.email+'">'+ICONS.mail+L(I18N.email)+'</a></div></div></div>';
  $$(".split",dpage).forEach(splitWords);
  $("#dBack").onclick=function(){history.back()};
  if(dio)dio.disconnect();
  dio=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle("in",e.isIntersecting)})},{root:dpage,threshold:.12});
  $$(".w3d,.fade,.split",dpage).forEach(function(el){dio.observe(el)});
}
function cardFrom(card){var r=card.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,side=(r.left+r.width/2)<vw/2?1:-1;
  return {t:"translate("+r.left+"px,"+r.top+"px) scale("+(r.width/vw)+","+(r.height/vh)+") rotateY("+(side*28)+"deg) rotateX(6deg)",side:side}}
function openDetail(k,card){
  detailIdx=k;srcCard=card;buildDetail(k);dpage.scrollTop=0;
  var f=cardFrom(card);doc.style.setProperty("--side",f.side);
  detail.classList.add("open");document.body.classList.add("det-open");
  dpage.style.transformOrigin="0 0";
  if(!reduce&&dpage.animate)dpage.animate([{transform:f.t,opacity:.4,borderRadius:"60px",filter:"blur(2px)"},{transform:"translate(0,0) scale(1,1) rotateY(0) rotateX(0)",opacity:1,borderRadius:"0px",filter:"blur(0)"}],{duration:900,easing:"cubic-bezier(.16,.84,.24,1)"});
  history.pushState({d:k},"","#app-"+APPS[k].id);
}
function closeDetail(){
  if(detailIdx==null)return;var card=srcCard,done=function(){detail.classList.remove("open");dpage.innerHTML="";detailIdx=null};
  document.body.classList.remove("det-open");
  if(!reduce&&dpage.animate&&card&&document.body.contains(card)){var f=cardFrom(card);var an=dpage.animate([{transform:"none",opacity:1,borderRadius:"0px"},{transform:f.t,opacity:0,borderRadius:"60px"}],{duration:750,easing:"cubic-bezier(.6,0,.3,1)"});an.onfinish=done}else done();
}
window.addEventListener("popstate",function(){if(detailIdx!=null)closeDetail()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&detailIdx!=null)history.back()});

/* ---------- live tickers ---------- */
var T0=Date.now();
setInterval(function(){var el=(Date.now()-T0)/1000;$$(".tick").forEach(function(t){var s=Math.floor(+t.dataset.s+el),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;t.textContent=digits((h?h+":":"")+("0"+m).slice(-2)+":"+("0"+x).slice(-2))})},1000);

/* ---------- scroll engine ---------- */
var hero=$("#hero"),wm=$("#wm"),copy=$("#heroCopy"),hint=$("#hint"),bgDark=$("#bgDark"),top=$("#top"),prog=$("#progress"),scene=$("#scene"),layers=$$("#scene .layer"),t0=performance.now();
function frame(now){
  var vh=innerHeight,y=scrollY,t=(now-t0)/1000,H=doc.scrollHeight-vh;
  prog.style.width=(H>0?y/H*100:0)+"%";
  mx+=(tmx-mx)*.06;my+=(tmy-my)*.06;
  var tot=vh,p=clamp(y/tot,0,1);
  var sway=reduce?0:Math.sin(t*.6)*16;
  logo.style.transform="translateZ("+(-p*520)+"px) rotateY("+(sway+mx*22+p*40)+"deg) rotateX("+(-my*12+p*38)+"deg) scale("+(1-p*.15)+")";
  logo.style.opacity=String(1-clamp((p-.45)/.4,0,1));
  wm.style.transform="perspective(800px) translateZ("+(-p*300)+"px) rotateX("+(p*55)+"deg)";wm.style.opacity=String(1-clamp((p-.3)/.4,0,1));
  copy.style.transform="perspective(900px) translateY("+(-p*60)+"px) translateZ("+(-p*200)+"px) rotateX("+(p*25)+"deg)";copy.style.opacity=String(1-clamp((p-.5)/.4,0,1));
  copy.style.filter=p>.5?"blur("+((p-.5)*14).toFixed(1)+"px)":"none";
  hint.style.opacity=String(1-clamp(p/.1,0,1));
  parts.forEach(function(q,i){var a=q.a+t*.45*q.s,R=logo.offsetWidth*.62;q.el.style.transform="translate3d("+(Math.cos(a)*R).toFixed(1)+"px,"+(Math.sin(a)*R*.22+Math.sin(t*2+i)*6).toFixed(1)+"px,"+(Math.sin(a)*R*.8).toFixed(1)+"px)";q.el.style.opacity=(0.35+0.65*(Math.sin(a)*.5+.5)).toFixed(2)});
  var dk=1-clamp((y-vh*.3)/(vh*.6),0,1);bgDark.style.opacity=dk.toFixed(3);top.classList.toggle("light",dk<.45);
  if(scene){var sr=scene.getBoundingClientRect();if(sr.bottom>0&&sr.top<vh){var c=(sr.top+sr.height/2-vh/2)/vh;layers.forEach(function(l){var k=+l.dataset.k;l.style.transform="translate3d("+(-mx*k*60)+"px,"+(c*k*160)+"px,0) scale(1.06)"})}}
  var rr=rail.getBoundingClientRect(),mc=rr.left+rr.width/2,sw=stepW(),best=1e9;
  if(rr.bottom>0&&rr.top<vh)slots.forEach(function(s,i){var r=s.getBoundingClientRect(),off=(r.left+r.width/2-mc)/sw,a=Math.min(Math.abs(off),2.2),card=s.firstChild;
    if(Math.abs(off)<best){best=Math.abs(off);activeSlot=i}
    var mob=innerWidth<=600;card.style.transform="rotateY("+(clamp(off,-2.2,2.2)*(mob?-40:-32)).toFixed(2)+"deg) translateZ("+(-a*(mob?150:120)).toFixed(1)+"px) scale("+(1-a*(mob?.1:.05)).toFixed(3)+")";card.style.opacity=(1-a*(mob?.32:.28)).toFixed(3);s.style.zIndex=String(100-Math.round(a*20));card.style.filter=mob&&a>.3?"brightness("+(1-a*.12).toFixed(2)+")":""});
  dots.forEach(function(d,i){d.className=i===activeSlot?"on":""});
  requestAnimationFrame(frame)}

/* ---------- init ---------- */
var q=location.search,ql=(q.match(/lang=(fa|en|ar)/)||[])[1];
LANG=ql||store("sv-lang")||"fa";if(!I18N.company[LANG])LANG="fa";
if(location.hash.indexOf("#app-")===0)history.replaceState(null,"",location.pathname+location.search);
renderAll();requestAnimationFrame(frame);
setTimeout(function(){goSlot(0,"auto")},80);
window.addEventListener("resize",function(){sizeMinis();goSlot(activeSlot,"auto")});
})();

</script>
